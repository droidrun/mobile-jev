[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mobilerun-agents"
version = "0.1.0"
description = "LLM-powered agents for Mobilerun"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "mobilerun>=0.7.4", "llama-index-core>=0.14.26,<0.15", "llama-index-workflows>=2.16.0,<3.0.0",
  "llama-index-llms-openai>=0.9.0,<0.10", "llama-index-llms-openai-like>=0.9.0,<0.10",
  "llama-index-llms-google-genai>=0.12.0,<0.13", "llama-index-llms-ollama>=0.12.0,<0.13",
  "llama-index-llms-openrouter>=0.7.0,<0.8", "google-genai>=2.34.0",
  "opentelemetry-exporter-otlp-proto-http>=1.40.0", "opentelemetry-sdk>=1.40.0",
  "openinference-instrumentation-llama-index>=3.0.0", "openinference-instrumentation>=0.1.83",
  "posthog>=6.7.6", "filelock>=4.2.1", "jinja2>=3.1.6",
  "pydantic>=2.11.10", "pydantic-settings>=2.16.0,<3", "rich>=14.1.0",
  "httpx>=0.27.0", "click>=8.1", "PyYAML>=6.0",
  "openai>=2.0.0",
  "anthropic>=0.67.0,<2", "llama-index-llms-anthropic>=0.13.0,<0.14",
  "typesafe-sdk>=0.7.5,<0.8.0",
  "Pillow>=13.0.0",
]

[project.optional-dependencies]
langfuse = ["langfuse==4.15.1"]
dev = ["black==26.10.1", "ruff>=0.13.0", "pytest>=8.0.0", "pytest-timeout>=2.3.1", "hatchling>=1.27", "mypy>=1.15"]

[tool.uv]
# Temporary: published mobilerun 0.7.4 pins old LlamaIndex adapters. Drop once base #553 is released.
override-dependencies = [
  "filelock>=4.2.1",
  "llama-index-llms-openai>=0.9.0,<0.10",
  "llama-index-llms-openai-like>=0.9.0,<0.10",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/mobilerun_agents"]
exclude = ["/src/mobilerun_agents/README.md"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md", "/CONTRIBUTING.md", "/AGENTS.md", "/LICENSE", "/scripts", "/tests", "/uv.lock"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["smoke: opt-in real-world smoke tests", "smoke_llm: smoke tests consuming LLM tokens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
follow_untyped_imports = true
follow_imports = "silent"

[project.entry-points."mobilerun.cli"]
agent = "mobilerun_agents.cli.agent.group:agent"
macro-agent = "mobilerun_agents.cli.macro_agent.group:macro_agent"

[project.entry-points."mobilerun.operators"]
agent_macro = "mobilerun_agents.cli.macro_agent.replay:replay_handoff"
